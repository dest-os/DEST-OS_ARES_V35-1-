name: ARES Release Check

on:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter bağımlılıkları
        run: flutter pub get

      - name: Analiz
        run: flutter analyze

      - name: Testler
        run: flutter test

      - name: APK
        run: flutter build apk --release

      - name: Android App Bundle
        run: flutter build appbundle --release

      - name: Release çıktıları
        uses: actions/upload-artifact@v4
        with:
          name: dest-os-ares-release-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
